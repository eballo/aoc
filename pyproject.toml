[project]
name = "aoc"
version = "0.1.0"
description = "Advent of Code"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "requests>=2.32.3,<3",
    "numpy>=2.1.3,<3",
    "termcolor>=3.3.0,<4",
    "parse>=1.20.2,<2",
    "advent-of-code-data>=2.0.4,<3",
    "Jinja2>=3.1.4,<4",
    "beautifulsoup4>=4.12.3,<5",
    "typer>=0.27.2,<1",
]

[project.scripts]
aocx = "aoc.cli:app"

[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["aoc*"]
